name: ✨ Feature Request
description: Suggest an idea or feature enhancement for AURA Co-Pilot
title: "[FEATURE]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting a feature for AURA Co-Pilot!

  - type: textarea
    id: feature-description
    attributes:
      label: Feature Description
      description: A clear and concise description of what feature or improvement you are proposing.
      placeholder: Describe the feature...
    validations:
      required: true

  - type: textarea
    id: problem-solution
    attributes:
      label: Problem & User Impact
      description: Is your feature request related to a problem or limitation?
      placeholder: Describe why this feature would be useful...
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: Proposed Solution or Alternatives
      description: Describe any alternative solutions or features you've considered.
    validations:
      required: false
