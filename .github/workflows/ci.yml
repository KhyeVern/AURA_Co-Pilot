name: AURA Co-Pilot CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  validate-python:
    name: Validate Python CV Backend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Syntax Compilation Check
        run: |
          python -m py_compile aura_camera_tracker.py

      - name: Lint with flake8
        run: |
          # stop the build if there are Python syntax errors or undefined names
          flake8 aura_camera_tracker.py --count --select=E9,F63,F7,F82 --show-source --statistics
          # exit-zero treats all errors as warnings
          flake8 aura_camera_tracker.py --count --exit-zero --max-complexity=15 --max-line-length=120 --statistics

  validate-web:
    name: Validate Web Dashboard Assets
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Verify Core Web Files
        run: |
          test -f index.html || (echo "index.html missing" && exit 1)
          test -f style.css || (echo "style.css missing" && exit 1)
          test -f app.js || (echo "app.js missing" && exit 1)
          test -f face_tracker.js || (echo "face_tracker.js missing" && exit 1)
          echo "All web dashboard core files verified successfully."
